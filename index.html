
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مساعد حكم كرة الطائرة</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:15px;
 font-family:Tahoma,Arial;
 background:#edf4fa;color:#17324d;
}
.container{max-width:1000px;margin:auto}
h1{text-align:center;color:#1766a0}
.scoreboard{
 display:grid;grid-template-columns:1fr 1fr;
 gap:12px;margin-bottom:20px
}
.team{
 background:white;padding:15px;border-radius:14px;
 box-shadow:0 2px 9px #0001;text-align:center;
}
.team input{
 width:100%;padding:10px;margin:5px 0;
 border:1px solid #cbd8e5;border-radius:7px;
 text-align:center;font-size:16px
}
.score{font-size:42px;font-weight:bold;margin:8px}
button{
 border:0;border-radius:8px;padding:11px 16px;
 cursor:pointer;font-size:15px;margin:4px;
 background:#1766a0;color:white
}
.point{background:#13834b}
.minus{background:#c0392b}
.serve{background:#e8a52b;color:#222}
.court{
 background:#d99a54;border:5px solid white;
 border-radius:12px;padding:12px;margin:15px 0;
 display:grid;grid-template-columns:1fr 1fr;gap:12px;
}
.side{
 background:#f5c783;border:2px solid white;
 padding:10px;border-radius:8px
}
.side h3{text-align:center}
.players{
 display:grid;
grid-template-areas:
 "p2 p3 p4"
 "p1 p6 p5";
 grid-template-columns:repeat(3,1fr);
 gap:7px;
}
.player{
 background:#fff;border:2px solid #1766a0;
 border-radius:8px;padding:7px;text-align:center;
}
.player small{display:block;color:#1766a0;font-weight:bold}
.player input{
 width:100%;min-width:0;border:0;
 border-bottom:1px solid #ddd;
 padding:6px 1px;text-align:center;
 background:transparent;font-size:13px;
}
.p1{grid-area:p1}.p2{grid-area:p2}
.p3{grid-area:p3}.p4{grid-area:p4}
.p5{grid-area:p5}.p6{grid-area:p6}
.status{
 background:#fff;padding:14px;text-align:center;
 border-radius:10px;font-weight:bold;margin:12px 0
}
.actions{text-align:center}
@media(max-width:600px){
 body{padding:7px}
 .court{gap:5px;padding:5px}
 .side{padding:5px}
 .player{padding:3px}
 .player input{font-size:11px}
 .team{padding:8px}
 button{padding:9px 10px}
}
</style>
</head>
<body>
<div class="container">

<h1>🏐 مساعد حكم كرة الطائرة</h1>

<div class="scoreboard">
 <div class="team">
  <input id="nameA" value="الفريق الأول">
  <div class="score" id="scoreA">0</div>
  <button class="point" onclick="addPoint('A')">+ نقطة للفريق</button>
  <button class="minus" onclick="undoPoint('A')">− تراجع</button>
  <button class="serve" onclick="setServe('A')">يبدأ بالإرسال</button>
 </div>

 <div class="team">
  <input id="nameB" value="الفريق الثاني">
  <div class="score" id="scoreB">0</div>
  <button class="point" onclick="addPoint('B')">+ نقطة للفريق</button>
  <button class="minus" onclick="undoPoint('B')">− تراجع</button>
  <button class="serve" onclick="setServe('B')">يبدأ بالإرسال</button>
 </div>
</div>

<div class="status" id="status">
 حق الإرسال: الفريق الأول
</div>

<div class="court">

<div class="side">
<h3 id="courtNameA">الفريق الأول</h3>
<div class="players">
<div class="player p1"><small>1 - </small><input id="A1" value="اللاعب "></div>
<div class="player p2"><small>2 - </small><input id="A2" value="اللاعب "></div>
<div class="player p3"><small>3 - </small><input id="A3" value="اللاعب "></div>
<div class="player p4"><small>4 - </small><input id="A4" value="اللاعب "></div>
<div class="player p5"><small>5 - </small><input id="A5" value="اللاعب "></div>
<div class="player p6"><small>6 - </small><input id="A6" value="اللاعب "></div>
</div>
</div>

<div class="side">
<h3 id="courtNameB">الفريق الثاني</h3>
<div class="players">
<div class="player p1"><small>1 - </small><input id="B1" value="اللاعب "></div>
<div class="player p2"><small>2 - </small><input id="B2" value="اللاعب "></div>
<div class="player p3"><small>3 - </small><input id="B3" value="اللاعب "></div>
<div class="player p4"><small>4 - </small><input id="B4" value="اللاعب "></div>
<div class="player p5"><small>5 - </small><input id="B5" value="اللاعب "></div>
<div class="player p6"><small>6 - </small><input id="B6" value="اللاعب "></div>
</div>
</div>

</div>

<div class="actions">
<button onclick="resetGame()">إعادة المباراة</button>
</div>

</div>

<script>
let scores={A:0,B:0};
let serving='A';
let history=[];

function teamName(t){
 return document.getElementById('name'+t).value || 'الفريق '+t;
}

function update(){
 document.getElementById('scoreA').textContent=scores.A;
 document.getElementById('scoreB').textContent=scores.B;
 document.getElementById('courtNameA').textContent=teamName('A');
 document.getElementById('courtNameB').textContent=teamName('B');
 document.getElementById('status').textContent=
 'حق الإرسال: '+teamName(serving);
}

function setServe(t){
 serving=t;
 update();
}

function rotate(t){
 let old=[];
 for(let i=1;i<=6;i++){
  old.push(document.getElementById(t+i).value);
 }
 for(let i=1;i<=6;i++){
  document.getElementById(t+i).value=old[i%6];
 }
}

// حفظ الحالة قبل تسجيل النقطة
function saveState(winner){
 let players={A:[],B:[]};

 ['A','B'].forEach(t=>{
  for(let i=1;i<=6;i++){
   players[t].push(
    document.getElementById(t+i).value
   );
  }
 });

 history.push({
  scores:{...scores},
  serving:serving,
  players:players,
  winner:winner
 });
}

function addPoint(winner){
 saveState(winner);

 scores[winner]++;

 if(winner!==serving){
  rotate(winner);
  serving=winner;
 }

 update();
}

// التراجع عن آخر نقطة مع استعادة الإرسال والدوران
function undoPoint(team){
 if(history.length===0){
  alert('لا توجد نقاط سابقة للتراجع عنها');
  return;
 }

 let last=history[history.length-1];

 if(last.winner!==team){
  alert('يجب التراجع عن آخر نقطة مسجلة أولاً');
  return;
 }

 let previous=history.pop();

 scores={...previous.scores};
 serving=previous.serving;

 ['A','B'].forEach(t=>{
  for(let i=1;i<=6;i++){
   document.getElementById(t+i).value=
    previous.players[t][i-1];
  }
 });

 update();
}

function resetGame(){
 if(!confirm('هل تريد إعادة المباراة؟'))return;

 scores={A:0,B:0};
 serving='A';
 history=[];

 update();
}

document.getElementById('nameA').addEventListener('input',update);
document.getElementById('nameB').addEventListener('input',update);

update();
</script>
</body>
</html>
